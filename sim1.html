<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Toucan Simulator | Portfolio Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka for a playful game/food/sport vibe & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Tone.js for procedural sound effects (no external audio URLs needed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#e01f27',
                        brandDark: '#0a0102',
                        brandYellow: '#f4bc22',
                        brandPink: '#ff00d3',
                    },
                    fontFamily: {
                        game: ['Fredoka', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Animations & Game Polish */
        body {
            background-color: #0a0102;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Background Grid Pattern for Arcade/Sports Feel */
        .arcade-bg {
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(224, 31, 39, 0.15) 0%, rgba(10, 1, 2, 0.95) 70%),
                linear-gradient(to right, rgba(255, 0, 211, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(244, 188, 34, 0.07) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* Bird Idle Breathing Animation */
        @keyframes idleBob {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(-1deg); }
        }

        /* Bird Walking Bounce Animation */
        @keyframes walkBounce {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            25% { transform: translateY(-16px) rotate(3deg); }
            50% { transform: translateY(0px) rotate(-2deg); }
            75% { transform: translateY(-16px) rotate(3deg); }
        }

        /* Leg Stride Animations */
        @keyframes legLeftWalk {
            0%, 100% { transform: rotate(-28deg); }
            50% { transform: rotate(32deg); }
        }

        @keyframes legRightWalk {
            0%, 100% { transform: rotate(32deg); }
            50% { transform: rotate(-28deg); }
        }

        /* Ground Track Scrolling when walking */
        @keyframes groundScroll {
            0% { background-position: 0px 0px; }
            100% { background-position: -120px 0px; }
        }

        /* Click Squash & Stretch Reaction */
        @keyframes squishPop {
            0% { transform: scale(1, 1); }
            30% { transform: scale(1.12, 0.88); }
            60% { transform: scale(0.94, 1.06); }
            100% { transform: scale(1, 1); }
        }

        /* Beak Snap Animation */
        @keyframes upperBeakSnap {
            0%, 100% { transform: rotate(0deg); }
            40% { transform: rotate(-16deg); }
            75% { transform: rotate(4deg); }
        }

        @keyframes lowerBeakSnap {
            0%, 100% { transform: rotate(0deg); }
            40% { transform: rotate(18deg); }
            75% { transform: rotate(-3deg); }
        }

        /* Wing Flap Animation */
        @keyframes wingFlap {
            0%, 100% { transform: rotate(0deg); }
            35% { transform: rotate(-35deg) translateY(-8px); }
            70% { transform: rotate(12deg); }
        }

        /* Applied Classes */
        .bird-idle {
            animation: idleBob 2.4s ease-in-out infinite;
        }

        .bird-walking {
            animation: walkBounce 0.65s ease-in-out infinite;
        }

        .leg-left {
            transform-origin: 215px 310px;
        }
        .leg-right {
            transform-origin: 255px 310px;
        }

        .walking .leg-left {
            animation: legLeftWalk 0.65s ease-in-out infinite;
        }

        .walking .leg-right {
            animation: legRightWalk 0.65s ease-in-out infinite;
        }

        .ground-track {
            background: repeating-linear-gradient(
                90deg,
                #e01f27 0px,
                #e01f27 30px,
                #f4bc22 30px,
                #f4bc22 60px,
                #ff00d3 60px,
                #ff00d3 90px,
                #0a0102 90px,
                #0a0102 120px
            );
        }

        .ground-moving {
            animation: groundScroll 0.65s linear infinite;
        }

        .animate-squish {
            animation: squishPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .upper-beak {
            transform-origin: 310px 165px;
        }
        .lower-beak {
            transform-origin: 310px 192px;
        }

        .beak-snapping .upper-beak {
            animation: upperBeakSnap 0.4s ease-out;
        }
        .beak-snapping .lower-beak {
            animation: lowerBeakSnap 0.4s ease-out;
        }

        .wing-group {
            transform-origin: 215px 225px;
        }
        .wing-flapping {
            animation: wingFlap 0.45s ease-out;
        }

        /* Interactive SVG Hover & Cursor */
        .interactive-part {
            cursor: pointer;
            transition: filter 0.2s ease;
        }
        .interactive-part:hover {
            filter: drop-shadow(0 0 12px rgba(244, 188, 34, 0.7));
        }

        /* Floating Score / Reaction Text */
        @keyframes floatUpFade {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-35px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-65px) scale(1); }
        }
        .floating-badge {
            position: absolute;
            pointer-events: none;
            animation: floatUpFade 0.85s ease-out forwards;
            z-index: 50;
        }

        /* Arcade Button 3D Press Effect */
        .btn-arcade {
            box-shadow: 0 6px 0 #991117, 0 10px 20px rgba(224, 31, 39, 0.4);
            transition: all 0.1s ease;
        }
        .btn-arcade:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #991117, 0 4px 10px rgba(224, 31, 39, 0.4);
        }

        .btn-arcade-active {
            background: linear-gradient(135deg, #ff00d3, #e01f27) !important;
            box-shadow: 0 6px 0 #8a0072, 0 10px 25px rgba(255, 0, 211, 0.5);
        }
    </style>
</head>
<body class="arcade-bg min-h-screen flex flex-col justify-between font-sans selection:bg-brandPink selection:text-white">

    <!-- Bottom Control Deck -->

    <!-- Interactive Logic & Sound Synthesis -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State Variables
            let isWalking = false;
            let soundEnabled = true;
            let bodyClicks = 0;
            let beakClicks = 0;
            let audioInitialized = false;

            // DOM Elements
            const moveBtn = document.getElementById('move-btn');
            const moveBtnText = document.getElementById('move-btn-text');
            const snackBtn = document.getElementById('snack-btn');
            const birdRig = document.getElementById('bird-rig');
            const birdSquishGroup = document.getElementById('bird-squish-group');
            const birdWing = document.getElementById('bird-wing');
            const birdBeak = document.getElementById('bird-beak');
            const groundStrip = document.getElementById('ground-strip');
            const stageArea = document.getElementById('stage-area');
            const bodyCountEl = document.getElementById('body-count');
            const beakCountEl = document.getElementById('beak-count');
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const soundToggle = document.getElementById('sound-toggle');
            const soundOnIcon = document.getElementById('sound-on-icon');
            const soundOffIcon = document.getElementById('sound-off-icon');
            const birdPupil = document.getElementById('bird-pupil');

            // Tone.js Synthesizers for Game Sound Effects
            let synth, membraneSynth;

            async function initAudio() {
                if (!audioInitialized && typeof Tone !== 'undefined') {
                    try {
                        await Tone.start();
                        synth = new Tone.PolySynth(Tone.Synth, {
                            oscillator: { type: 'triangle' },
                            envelope: { attack: 0.01, decay: 0.15, sustain: 0.05, release: 0.2 }
                        }).toDestination();
                        synth.volume.value = -8;

                        membraneSynth = new Tone.MembraneSynth({
                            pitchDecay: 0.03,
                            octaves: 4,
                            envelope: { attack: 0.005, decay: 0.15, sustain: 0 }
                        }).toDestination();
                        membraneSynth.volume.value = -6;
                        audioInitialized = true;
                    } catch (e) {
                        console.warn('Audio init deferred:', e);
                    }
                }
            }

            function playBodySound() {
                if (!soundEnabled || !audioInitialized) return;
                const notes = ['C5', 'E5', 'G5', 'A5'];
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                synth.triggerAttackRelease(randomNote, '16n');
            }

            function playBeakSound() {
                if (!soundEnabled || !audioInitialized) return;
                // Clack sound using high percussion + bright note
                membraneSynth.triggerAttackRelease('G4', '32n');
                setTimeout(() => {
                    if (soundEnabled && audioInitialized) {
                        synth.triggerAttackRelease('D6', '32n');
                    }
                }, 60);
            }

            function playStepSound() {
                if (!soundEnabled || !audioInitialized || !isWalking) return;
                membraneSynth.triggerAttackRelease('C2', '32n');
            }

            // Sound Toggle Handler
            soundToggle.addEventListener('click', async () => {
                await initAudio();
                soundEnabled = !soundEnabled;
                soundOnIcon.classList.toggle('hidden', !soundEnabled);
                soundOffIcon.classList.toggle('hidden', soundEnabled);
            });

            // Helper: Spawn Floating Pop-up Text on Stage
            function spawnPopup(x, y, text, colorHex) {
                const rect = stageArea.getBoundingClientRect();
                const badge = document.createElement('div');
                badge.className = 'floating-badge font-game font-bold text-lg sm:text-xl px-3 py-1 rounded-full shadow-lg border-2';
                badge.style.left = `${Math.min(Math.max(x - rect.left - 30, 10), rect.width - 110)}px`;
                badge.style.top = `${Math.min(Math.max(y - rect.top - 20, 10), rect.height - 50)}px`;
                badge.style.backgroundColor = '#0a0102';
                badge.style.borderColor = colorHex;
                badge.style.color = colorHex;
                badge.textContent = text;
                stageArea.appendChild(badge);

                setTimeout(() => {
                    badge.remove();
                }, 850);
            }

            // Helper: Retrigger CSS Animation cleanly
            function triggerAnimation(element, className) {
                element.classList.remove(className);
                void element.offsetWidth; // Force reflow
                element.classList.add(className);
            }

            // 1. CLICK BODY INTERACTION
            const bodyTriggers = document.querySelectorAll('.bird-body-trigger');
            bodyTriggers.forEach(trigger => {
                trigger.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await initAudio();
                    playBodySound();

                    bodyClicks++;
                    bodyCountEl.textContent = bodyClicks;

                    // Animate Squish & Wing Flap
                    triggerAnimation(birdSquishGroup, 'animate-squish');
                    triggerAnimation(birdWing, 'wing-flapping');

                    // Update Status Banner
                    const phrases = ['CHIRP! Wing Flap!', 'Turbo Feathers!', 'Ready to Sprint!', 'Boing! Nice Tap!'];
                    statusText.textContent = phrases[bodyClicks % phrases.length];
                    statusDot.style.backgroundColor = '#e01f27';

                    // Spawn Floating Badge
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 250;
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 200;
                    spawnPopup(clientX, clientY, 'FLAP! +1', '#e01f27');
                });
            });

            // 2. CLICK LONG BEAK INTERACTION
            birdBeak.addEventListener('click', async (e) => {
                e.stopPropagation();
                await initAudio();
                playBeakSound();

                beakClicks++;
                beakCountEl.textContent = beakClicks;

                // Animate Upper & Lower Beak Snap + Slight Squish
                triggerAnimation(birdBeak, 'beak-snapping');
                triggerAnimation(birdSquishGroup, 'animate-squish');

                // Update Status Banner
                const beakPhrases = ['CLACK-CLACK! Mega Beak!', 'Chomp Power Activated!', 'Neon Beak Snap!', 'Maximum Reach!'];
                statusText.textContent = beakPhrases[beakClicks % beakPhrases.length];
                statusDot.style.backgroundColor = '#ff00d3';

                // Spawn Floating Badge
                const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 420;
                const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 180;
                spawnPopup(clientX, clientY, 'SNAP! +1', '#ff00d3');
            });

            // 3. MOVE BUTTON (TOGGLE WALKING ANIMATION)
            let walkSoundInterval = null;

            moveBtn.addEventListener('click', async () => {
                await initAudio();
                isWalking = !isWalking;

                if (isWalking) {
                    // Activate Walking Mode
                    birdRig.classList.remove('bird-idle');
                    birdRig.classList.add('bird-walking', 'walking');
                    groundStrip.classList.add('ground-moving');
                    
                    moveBtn.classList.add('btn-arcade-active');
                    moveBtnText.textContent = 'STOP';
                    statusText.textContent = 'Bird is Strutting Down the Track!';
                    statusDot.style.backgroundColor = '#ff00d3';

                    // Subtle footstep rhythm
                    playStepSound();
                    walkSoundInterval = setInterval(playStepSound, 325);
                } else {
                    // Return to Idle Breathing Mode
                    birdRig.classList.remove('bird-walking', 'walking');
                    birdRig.classList.add('bird-idle');
                    groundStrip.classList.remove('ground-moving');

                    moveBtn.classList.remove('btn-arcade-active');
                    moveBtnText.textContent = 'MOVE';
                    statusText.textContent = 'Bird Paused — Tap Body or Beak!';
                    statusDot.style.backgroundColor = '#f4bc22';

                    clearInterval(walkSoundInterval);
                }
            });

            // 4. BONUS SNACK BUTTON (Food/Game Theme)
            snackBtn.addEventListener('click', async () => {
                await initAudio();
                playBeakSound();
                triggerAnimation(birdBeak, 'beak-snapping');
                triggerAnimation(birdWing, 'wing-flapping');
                
                const rect = birdBeak.getBoundingClientRect();
                spawnPopup(rect.right - 20, rect.top, 'YUM! 🍒 +5', '#f4bc22');
                statusText.textContent = 'CHOMP! Delicious Arcade Berry!';
            });

            // 5. SUBTLE EYE TRACKING (Follows Mouse/Touch)
            window.addEventListener('mousemove', (e) => {
                const svgRect = document.getElementById('bird-svg').getBoundingClientRect();
                const eyeCenterX = svgRect.left + svgRect.width * 0.48;
                const eyeCenterY = svgRect.top + svgRect.height * 0.36;

                const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
                const distance = Math.min(4.5, Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 40);

                const pupilX = 287 + Math.cos(angle) * distance;
                const pupilY = 152 + Math.sin(angle) * distance;

                birdPupil.setAttribute('cx', pupilX);
                birdPupil.setAttribute('cy', pupilY);
            });
        });
    </script>
</body>
</html>
